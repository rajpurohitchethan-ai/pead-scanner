<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEAD Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --sheet-2:#F5F7FA; --line:#D6DCE5; --line-2:#E6EAF0;
  --ink:#15233F; --ink-2:#4A5874; --ink-3:#7A869C;
  --gain:#0E7A5F; --gain-bg:#E3F3EE; --loss:#B42318; --loss-bg:#FBE9E7;
  --act:#3B3FB6; --act-bg:#E8E9FA; --watch:#A86A12; --watch-bg:#FBF1DF;
  --grid:#E3E8EF; --price:#15233F; --ema:#8A96AD;
  --num:"IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --text:"Instrument Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1622; --sheet:#162133; --sheet-2:#1B283D; --line:#2A3A55; --line-2:#22314A;
    --ink:#E7EDF7; --ink-2:#AAB6CB; --ink-3:#7F8CA4;
    --gain:#3CC79F; --gain-bg:#12352D; --loss:#F07A6C; --loss-bg:#3A1D1D;
    --act:#9EA2FF; --act-bg:#262A5A; --watch:#E6B25C; --watch-bg:#3A2D14;
    --grid:#22314A; --price:#E7EDF7; --ema:#6F7D97; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1622; --sheet:#162133; --sheet-2:#1B283D; --line:#2A3A55; --line-2:#22314A;
  --ink:#E7EDF7; --ink-2:#AAB6CB; --ink-3:#7F8CA4;
  --gain:#3CC79F; --gain-bg:#12352D; --loss:#F07A6C; --loss-bg:#3A1D1D;
  --act:#9EA2FF; --act-bg:#262A5A; --watch:#E6B25C; --watch-bg:#3A2D14;
  --grid:#22314A; --price:#E7EDF7; --ema:#6F7D97; color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--text)}
a{color:var(--act)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 64px}

/* Header */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.mast h1{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.mast h1 small{display:block;font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.regime{max-width:420px;font-size:14px;color:var(--ink-2)}
.regime b{color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--ink-3)}
.dot.on{background:var(--gain)}.dot.mixed{background:var(--watch)}.dot.off{background:var(--loss)}
.season{margin:14px 0 4px;font-size:16px;color:var(--ink-2)}
.season strong{color:var(--ink);font-weight:600}

/* Tabs and controls */
.tabs{display:flex;gap:4px;margin:18px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 14px;border-radius:999px;color:var(--ink-2);font-weight:600;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab .c{font-family:var(--num);font-weight:500;opacity:.75;margin-left:5px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.controls input[type=search]{flex:1 1 200px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.controls select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.toggle{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--act);margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.chip{border:1px solid var(--line);background:var(--sheet);padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--act);color:var(--act);background:var(--act-bg)}

/* Sizing panel */
.sizing{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 12px;margin-bottom:14px;border:1px dashed var(--line);border-radius:10px;font-size:14px;color:var(--ink-2)}
.sizing label{display:inline-flex;align-items:center;gap:6px}
.sizing input{width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.sizing input.sm{width:64px}

/* Setup cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.card{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px 20px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.card.s-go::before{background:var(--act)}
.card.s-watch::before{background:var(--watch)}
.card.s-no::before{background:var(--loss)}
.card.s-pending::before{background:var(--ink-3)}
.card.dim{opacity:.72}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sym{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.co{color:var(--ink-2);font-size:14px;margin-top:1px}
.score{text-align:right;flex:none}
.score .v{font-family:var(--num);font-size:30px;font-weight:600;line-height:1}
.score .l{font-size:12px;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.tag{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--line-2)}
.tag.go{background:var(--act-bg);color:var(--act);border-color:transparent;font-weight:600}
.tag.good{background:var(--gain-bg);color:var(--gain);border-color:transparent}
.tag.bad{background:var(--loss-bg);color:var(--loss);border-color:transparent}
.tag.warn{background:var(--watch-bg);color:var(--watch);border-color:transparent}
.meta{font-size:13px;color:var(--ink-3);margin-top:6px}
.meta.call{margin-top:3px}
.meta.call a{font-weight:600;text-decoration:none;margin-left:4px}
.chart{display:block;width:100%;height:auto;margin:12px 0 4px;border-radius:6px;background:var(--sheet-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-3);margin-bottom:8px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:4px;margin-right:5px;background:var(--ink-3)}
.legend .le{background:var(--act)}.legend .ls{background:var(--loss)}.legend .lm{background:var(--ema);height:0;border-top:2px dashed var(--ema)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;margin:10px 0}
.fact h3{margin:0 0 3px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.fact p{margin:0;font-size:14px;color:var(--ink-2)}
.fact .big{font-family:var(--num);font-size:17px;font-weight:600;color:var(--ink);margin-right:8px}
.up,.fact .big.up{color:var(--gain)} .down,.fact .big.down{color:var(--loss)}
.plan{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:var(--sheet-2)}
.plan-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.plan-sig{font-weight:700}
.plan-sig.go{color:var(--act)} .plan-sig.watch{color:var(--watch)} .plan-sig.no{color:var(--loss)} .plan-sig.pending{color:var(--ink-3)}
.plan-why{font-size:13.5px;color:var(--ink-2);margin:4px 0 0}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.lv span{display:block;font-size:12px;color:var(--ink-3)}
.lv b{font-family:var(--num);font-size:17px;font-weight:600}
.lv.e b{color:var(--act)} .lv.s b{color:var(--loss)}
.qty{font-size:13px;color:var(--ink-2);margin-top:8px}
details.tvd{margin:4px 0 10px}details.tvd summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:600}
details.tvd summary .nm{font-weight:400;margin-left:6px}
details.watch h4{font-size:12.5px;margin:12px 0 4px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}.wl{list-style:none;margin:0;padding:0;font-size:13px}.wl li{padding:5px 0;border-top:1px solid var(--line-2);overflow-wrap:anywhere}.wl li:first-child{border-top:0}.wl .tag{font-size:11px}.wpeers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;font-size:13px}.wpeers div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line-2);padding:3px 0}.wpeers b{font-weight:600;white-space:nowrap}.wflags{font-size:13px;color:var(--ink-2);margin:6px 0}.card.gm{margin-top:14px}.tag.theme{background:#5B3FB6;color:#fff;border-color:transparent}.install-wait{background:var(--watch-bg);color:var(--watch);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px}.gpill{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:middle;background:var(--line-2);color:var(--ink-2)}.gpill.gA{background:var(--gain);color:#fff}.gpill.gB{background:var(--act-bg);color:var(--act)}.gpill.gC{background:var(--watch-bg);color:var(--watch)}.grade-why{padding-bottom:2px}.grade-why .up{color:var(--gain)}.grade-why .down{color:var(--loss)}.copybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}.copybar button,.audit button,.sdetail button,.qtx button{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}#qty-in{width:min(260px,70%)}details.sect-c>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center}details.sect-c>summary::-webkit-details-marker{display:none}details.sect-c>summary::before{content:"▸";color:var(--ink-3)}details.sect-c[open]>summary::before{content:"▾"}details.sect-c .td{border:0;padding:6px 0 0;margin:0}.rsline{font-size:13px;margin:6px 0}.capbar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden;margin:8px 0 2px}.capbar i{display:block;height:100%}.capbar i.go{background:var(--gain)}.capbar i.watch{background:var(--watch)}.capbar i.bad{background:var(--loss)}.tnote{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin:10px 0}.tnote p{margin:6px 0;font-size:13.5px;line-height:1.45}.tnote-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.card.gm h3{font-size:15px;margin:0 0 8px}
.tvbox{height:380px;margin-top:8px;border-radius:6px;overflow:hidden;background:var(--sheet-2)}
.tvbox .tradingview-widget-copyright{font-size:11.5px;text-align:right;padding-top:4px}
@media (min-width:700px){.tvbox{height:460px}}
details.why{margin-top:10px}
details.why summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:600}
.why-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;font-size:13.5px}
.why-cols h4{margin:0 0 4px;font-size:13px}
.why-cols ul{margin:0;padding-left:18px;color:var(--ink-2)}
.why-cols .pos h4{color:var(--gain)} .why-cols .neg h4{color:var(--loss)}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13.5px}
.links a{text-decoration:none;font-weight:600}
.links a:hover{text-decoration:underline}

/* Ledger (watchlist) */
.day{margin:18px 0 6px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:baseline}
.day small{font-weight:500;color:var(--ink-3)}
.ledger{background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) repeat(3,minmax(0,.8fr)) 20px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line-2);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sheet-2)}
.row .s{font-weight:700}
.row .nm{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{font-size:11.5px;color:var(--ink-3)}
.row .v{font-family:var(--num);font-weight:600}
.row .chev{color:var(--ink-3);transition:transform .15s}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.row-detail{padding:4px 12px 14px;border-top:1px dashed var(--line-2);background:var(--sheet-2)}
.hdr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) repeat(3,minmax(0,.8fr)) 20px;gap:10px;padding:0 12px 6px;font-size:12px;color:var(--ink-3)}

/* Tables */
table{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line-2)}
th{font-size:12.5px;color:var(--ink-3);font-weight:600;border-top:0;background:var(--sheet-2)}
td.r,th.r{text-align:right}
.bar{position:relative;height:8px;background:var(--line-2);border-radius:4px;min-width:90px}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.note{font-size:13.5px;color:var(--ink-2);max-width:70ch}
.fact .note{font-size:12px;margin-top:4px}
.audit{margin:0 0 14px;padding:12px;border:1px solid var(--line,#2a3446);border-radius:12px}.audit h3{margin:0 0 8px;font-size:15px}.arow{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line,#2a3446);font-size:14px}.arow:first-of-type{border-top:0}.arow .tag{flex:none}.muted{opacity:.75;font-size:13px}
.lens{margin:10px 0 4px}.lens table{width:100%;border-collapse:collapse;font-size:13.5px}.lens th,.lens td{padding:4px 6px;border-bottom:1px solid var(--line,#2a3446)}.lens thead th{font-size:12px;color:var(--ink-2);font-weight:600}.lens tbody th{text-align:left;font-weight:600}
.lens-notes{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.row.radar-row{grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr)) 16px;border-top:1px solid var(--line-2)}.radar-why{font-size:12.5px;color:var(--ink-2);padding:0 12px 10px}.radar-row .tag{font-size:11px;white-space:normal;line-height:1.25}.radar-sub{font-size:14px;margin:18px 0 4px}.radar-why.radar-lv{padding-top:0;line-height:1.5}
.td{margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line,#2a3446);border-radius:12px}
.td-h{font-size:13px;margin-bottom:8px}.td-row{display:flex;flex-wrap:wrap;gap:6px}
.tdc{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line,#2a3446)}
.tdc i{font-style:normal;font-weight:700}.tdc.ok{background:var(--gain-bg);color:var(--gain);border-color:transparent}
.tdc.bad{background:var(--loss-bg);color:var(--loss);border-color:transparent}.tdc.warn{background:var(--watch-bg);color:var(--watch);border-color:transparent}
.tdc.na{opacity:.6}.td-more{margin-top:6px;font-size:13px}.td-more summary{cursor:pointer;opacity:.8}.td-notes{margin:6px 0 0;padding-left:18px}
.peers{margin:8px 0;font-size:13.5px;line-height:1.5}.peers .meta{display:block}
.homework{font-size:12.5px;opacity:.85;margin:10px 0 4px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.tscroll table{min-width:520px}
.srow{cursor:pointer}.chev-s{display:inline-block;width:12px;opacity:.7}.sdetail td{background:var(--card-2,transparent)}
.plist{margin:4px 0 8px;padding-left:22px;font-size:13.5px;line-height:1.7}.plist .n{margin:0 4px}
.controls .dirbtn{white-space:nowrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:inherit;font:inherit}
.internals{display:flex;flex-direction:column;gap:2px;font-size:12.5px;opacity:.85;margin-top:4px}
.jtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 10px}.jtiles div{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px}.jtiles span{display:block;font-size:12px;color:var(--ink-3)}.jtiles b{font-size:17px}.journal h4{font-size:13px;margin:10px 0 6px}.heat-sec{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tag.warn{background:var(--watch-bg);color:var(--watch)}.card.heat{margin:12px 0}
.heatmap td.n{color:var(--ink)}.pfs{margin-top:6px}.pfs .pf{display:block}.warn-t{color:var(--watch)}
.install-bad{background:#7f1d1d;color:#fff;border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px;line-height:1.4}
.health{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.hbox{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px}
.hbox span{font-size:12.5px;color:var(--ink-3)}
.hbox b{display:block;font-family:var(--num);font-size:22px;font-weight:600;margin-top:2px}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty button{margin-top:10px;border:1px solid var(--act);background:var(--act-bg);color:var(--act);padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer}
.foot{margin-top:28px;font-size:12.5px;color:var(--ink-3);max-width:80ch}
.theme-btn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px;margin-top:8px;color:var(--ink-2)}

@media (max-width:640px){
  .wrap{padding:14px 12px 56px}
  .mast h1{font-size:24px}
  .levels{grid-template-columns:repeat(2,1fr)}
  .why-cols{grid-template-columns:1fr}
  .row,.hdr{grid-template-columns:minmax(0,1.5fr) repeat(2,minmax(0,.9fr)) 16px}
  .row .opt,.hdr .opt{display:none}
  .row.radar-row{grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr)) 14px;gap:8px}
  .hide-sm{display:none}
  .sectbl td,.sectbl th{white-space:normal}.sectbl td:first-child{max-width:132px;overflow-wrap:anywhere}.sectbl .tag{white-space:normal;font-size:11px;line-height:1.25}.tscroll table.sectbl{min-width:0}.sectbl .sdetail td{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 2.9.48: livelier page (owner request) - motion is small and off under reduced-motion */
.tabs{position:sticky;top:0;z-index:20;padding:8px 0;margin:10px 0 12px;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab{transition:background .18s,color .18s,transform .12s}.tab:active{transform:scale(.96)}
.card{transition:transform .18s,box-shadow .18s}
@media (hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(21,35,63,.12)}}
.row{transition:background .15s}.row:active,.row[aria-expanded="true"]{background:var(--sheet-2)}
.row-detail{animation:detail-in .22s ease-out}
@keyframes detail-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#view.enter>*{animation:rise .3s ease-out both}
#view.enter>*:nth-child(2){animation-delay:.04s}#view.enter>*:nth-child(3){animation-delay:.08s}#view.enter>*:nth-child(n+4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dot.on{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gain) 55%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
.rbar{margin:14px 0 6px}.rbar-track{position:relative;height:8px;border-radius:999px;background:var(--line-2)}
.rbar-fill{position:absolute;top:0;bottom:0;border-radius:999px}.rbar-fill.up{background:var(--gain)}.rbar-fill.down{background:var(--loss)}
.rbar-mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink-3);transform:translateX(-1px)}.rbar-mark.cost{background:var(--ink)}
.rbar-dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--sheet)}.rbar-dot.up{background:var(--gain)}.rbar-dot.down{background:var(--loss)}
.rbar-lab{position:relative;height:16px;margin-top:6px;font-size:11px;color:var(--ink-3)}.rbar-lab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rbar-lab span:first-child{transform:none}.rbar-lab span:last-child{transform:translateX(-100%)}
.stage-line{margin:8px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 2.9.49: Screener table */
.scr-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.scr-chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;transition:background .15s,color .15s,transform .12s}
.scr-chip:active{transform:scale(.96)}
.scr-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.scr-chip.clear{border-style:dashed;color:var(--ink-2)}
.scr-wrap{border:1px solid var(--line);border-radius:12px;background:var(--sheet);max-height:78vh;overflow:auto}
.tscroll table.scr{min-width:1080px;border:0;border-radius:0;font-size:13.5px;border-collapse:separate;border-spacing:0}
.scr th{position:sticky;top:0;z-index:3;background:var(--sheet-2);text-align:left;padding:9px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
.scr th[aria-sort="ascending"],.scr th[aria-sort="descending"]{color:var(--ink)}
.scr td{padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.scr td.n span,.scr-sym span{display:block;font-size:11.5px;color:var(--ink-3);font-family:var(--text);font-weight:400}
.scr-sym span.tag{display:inline-block;font-size:10.5px;padding:1px 5px}
.scr th:first-child,.scr td:first-child{position:sticky;left:0;z-index:2;background:var(--sheet);box-shadow:1px 0 0 var(--line-2);max-width:124px;overflow:hidden;text-overflow:ellipsis}
.scr th:first-child{z-index:4;background:var(--sheet-2)}
.scr-row{cursor:pointer}.scr-row:hover td,.scr-row[aria-expanded="true"] td{background:var(--sheet-2)}
.scr-detail td{white-space:normal;padding:0;background:var(--sheet-2);position:static}
.scr-detail td:first-child{position:static;max-width:none;box-shadow:none;background:var(--sheet-2)}
.scr-detail-in{position:sticky;left:0;width:min(100vw - 34px,1086px);padding:10px 10px 14px;animation:detail-in .22s ease-out}
@media (max-width:640px){.scr-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}.scr-chips::-webkit-scrollbar{display:none}.scr-chip{white-space:nowrap;flex:0 0 auto}}
.scr-more{display:block;width:100%;margin-top:8px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px;cursor:pointer}

/* ===== 2.9.68 design pass: one family (Archivo), condensed tabular figures, quiet chrome ===== */
:root{
  --paper:#EFF2F1; --sheet:#FFFFFF; --sheet-2:#F6F8F7; --line:#D5DCDA; --line-2:#E5EAE8;
  --ink:#102033; --ink-2:#4B5A6A; --ink-3:#7B8794;
  --gain:#0A7A52; --gain-bg:#E1F2EA; --loss:#B8322A; --loss-bg:#FAE8E6;
  --act:#1F4E8C; --act-bg:#E3ECF7; --watch:#9A6200; --watch-bg:#FAF0DC;
  --grid:#E2E7E5; --price:#102033; --ema:#8D99A3;
  --num:"Archivo", "Arial Narrow", sans-serif; --text:"Archivo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0C1520; --sheet:#121E2B; --sheet-2:#172534; --line:#26384A; --line-2:#1E2E3E;
  --ink:#E6EDF3; --ink-2:#A9B6C2; --ink-3:#7C8B99;
  --gain:#39C08C; --gain-bg:#103226; --loss:#EF7B6E; --loss-bg:#3A1C1A;
  --act:#8DB4F0; --act-bg:#1B2E4A; --watch:#E2B055; --watch-bg:#382A12; --grid:#1E2E3E; --price:#E6EDF3; --ema:#6E7E8C; } }
:root[data-theme="dark"]{
  --paper:#0C1520; --sheet:#121E2B; --sheet-2:#172534; --line:#26384A; --line-2:#1E2E3E;
  --ink:#E6EDF3; --ink-2:#A9B6C2; --ink-3:#7C8B99;
  --gain:#39C08C; --gain-bg:#103226; --loss:#EF7B6E; --loss-bg:#3A1C1A;
  --act:#8DB4F0; --act-bg:#1B2E4A; --watch:#E2B055; --watch-bg:#382A12; --grid:#1E2E3E; --price:#E6EDF3; --ema:#6E7E8C; }
body{font:15px/1.5 var(--text);font-variation-settings:"wdth" 100;background:var(--paper)}
.n,.score .v,.lv b,.fact .big,.big,td.n,.r.n,.tab .c,.jtiles b{font-family:var(--num);font-variation-settings:"wdth" 78;font-variant-numeric:tabular-nums;letter-spacing:0}
.wrap{padding:0 16px 64px}
/* app bar */
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -16px;padding:10px 16px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.brand h1{margin:0;font-size:21px;font-weight:800;font-variation-settings:"wdth" 118;letter-spacing:-.01em;line-height:1.1}
#sub{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme-btn{margin:0;flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--ink-2)}
/* market strip */
.mkt{margin:2px 0 10px;border:1px solid var(--line);background:var(--sheet);border-radius:10px}
.mkt summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.mkt summary::-webkit-details-marker{display:none}
.mkt summary::after{content:"Details";margin-left:auto;flex:none;font-size:12px;color:var(--act);font-weight:600}
.mkt[open] summary::after{content:"Hide"}
.mkt summary b{color:var(--ink)}
.mkt .internals{display:flex;flex-direction:column;gap:4px;margin:0;padding:0 12px 10px;font-size:12.5px;color:var(--ink-2);opacity:1}
.mkt #regime{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mkt[open] #regime{white-space:normal}
.season{margin:0 0 4px;font-size:14px;color:var(--ink-2)}
.install-bad{background:var(--watch-bg);color:var(--ink);border-left:3px solid var(--watch);border-radius:8px;padding:8px 12px;margin:0 0 8px;font-size:13px}
.install-bad b{color:var(--watch)}
.install-wait{border-radius:8px;padding:8px 12px;font-size:13px}
/* tabs: underline bar, sticky under the app bar */
.tabs{position:sticky;top:60px;z-index:19;gap:0;margin:10px -16px 14px;padding:0 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.tab{border-radius:0;padding:11px 10px 10px;font-weight:600;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:none;color:var(--ink);border-bottom-color:var(--ink)}
.tab .c{font-weight:500;font-size:12.5px;opacity:1;color:var(--ink-3);margin-left:4px}
/* controls */
.controls input[type=search],.controls select,.toggle{border-radius:8px;padding:8px 11px;font-size:14px}
.chip,.scr-chip{border-radius:8px}
.scr-chip[aria-pressed="true"]{background:var(--act);border-color:var(--act);color:#fff}
/* how-to-read disclosure (long notes fold away) */
details.about{margin:0 0 12px;font-size:13px;color:var(--ink-2)}
details.about summary{cursor:pointer;color:var(--act);font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.about summary::-webkit-details-marker{display:none}
details.about summary::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;background:radial-gradient(circle at 50% 30%,currentColor 1.4px,transparent 1.6px),linear-gradient(currentColor,currentColor) 50% 70%/1.5px 5px no-repeat;flex:none}
details.about p{margin:6px 0 0;max-width:72ch;line-height:1.5}
/* copy bar */
.copybar{gap:6px;margin:0 0 10px}
.copybar button{font-size:12.5px;padding:5px 9px;border-radius:7px;background:transparent}
/* cards and tags */
.card{border-radius:10px;padding:14px 14px 12px 17px;box-shadow:none}
.card::before{width:3px}
.tag{border-radius:6px;font-size:12px;padding:2px 7px}
.gpill{border-radius:5px}
.sym{font-size:20px;font-weight:750;font-variation-settings:"wdth" 108}
.ledger,.scr-wrap,.mkt{border-radius:10px}
.plan{border-radius:8px}
.note{font-size:13px}
h2.day{font-size:15px;font-weight:700;margin:22px 0 8px}
.foot{font-size:12px}
@media (max-width:640px){ .brand h1{font-size:19px} .tabs{top:44px} .tab{font-size:13.5px;padding:10px 9px} }

.brand{flex-direction:column;align-items:flex-start;gap:0}
#sub{white-space:normal}
.card.heat h3,.card.gm h3{margin-top:0}
.card.heat{padding-top:12px}
@media (max-width:640px){
  .row.radar-row{grid-template-columns:repeat(3,minmax(0,1fr)) 14px;row-gap:8px;column-gap:10px}
  .row.radar-row>div:first-child{grid-column:1/-1}
  .radar-row .nm{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .radar-row .nm .tag{white-space:nowrap}
  .tabs{top:58px}
}

/* My trades blotter */
.blotter{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden}
.bl-h,.bl-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1.6fr);gap:10px;align-items:center;padding:9px 12px}
.bl-h{font-size:12px;color:var(--ink-3);background:var(--sheet-2);border-bottom:1px solid var(--line);padding-top:7px;padding-bottom:7px}
.bl-row{border-top:1px solid var(--line-2);color:inherit;text-decoration:none}
.bl-row:first-of-type{border-top:0}
.bl-row:hover{background:var(--sheet-2)}
.bl-row small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400}
.bl-sym{font-weight:700;font-variation-settings:"wdth" 100;overflow:hidden;text-overflow:ellipsis}
.bl-row .r small.up{color:var(--gain)}.bl-row .r small.down{color:var(--loss)}
.act{display:inline-block;font-size:13px;font-weight:700;line-height:1.25}
.act.bad{color:var(--loss)}.act.warn{color:var(--watch)}.act.good{color:var(--gain)}
.bl-act small{font-family:var(--num);font-variation-settings:"wdth" 82}
.blotter .meta{margin:0;padding:8px 12px;border-top:1px solid var(--line-2);font-size:12px}
details.more{margin-top:10px;border-top:1px solid var(--line-2);padding-top:8px}
details.more>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--act);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"− "}
.card[id]{scroll-margin-top:110px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<main class="wrap">
  <header class="appbar">
    <div class="brand"><h1>PEAD radar</h1><span id="sub">Loading results season…</span></div>
    <button class="theme-btn" id="theme" type="button">Dark mode</button>
  </header>
  <details class="mkt"><summary><span id="regime"></span></summary><div class="internals" id="internals"></div></details>
  <p class="season" id="season"></p>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-tab="screen" aria-selected="true">Screener</button>
    <button class="tab" role="tab" data-tab="setups" aria-selected="false">Results<span class="c" id="c-setups"></span></button>
    <button class="tab" role="tab" data-tab="radar" aria-selected="false">Radar<span class="c" id="c-radar"></span></button>
    <button class="tab" role="tab" data-tab="trades" aria-selected="false">My trades<span class="c" id="c-trades"></span></button>
    <button class="tab" role="tab" data-tab="watch" aria-selected="false">Upcoming<span class="c" id="c-watch"></span></button>
    <button class="tab" role="tab" data-tab="sectors" aria-selected="false">Sectors<span class="c" id="c-sectors"></span></button>
    <button class="tab" role="tab" data-tab="score" aria-selected="false">Scorecard</button>
    <button class="tab" role="tab" data-tab="health" aria-selected="false">Health</button>
  </nav>

  <div class="controls" id="controls">
    <input type="search" id="q" placeholder="Search symbol, company or sector" aria-label="Search">
    <label class="toggle"><input type="checkbox" id="liquid" checked> Tradeable only</label>
    <select id="sort" aria-label="Sort by">
      <option value="conviction">Sort: conviction</option>
      <option value="topdown">Sort: top-down check</option>
      <option value="date">Sort: result date</option>
      <option value="reaction">Sort: reaction day %</option>
      <option value="rvol">Sort: reaction volume (RVOL)</option>
      <option value="volume">Sort: volume signature (HVE/HVY/HVQ)</option>
      <option value="since">Sort: move since result</option>
      <option value="rs">Sort: strength vs NIFTY 500</option>
      <option value="revyoy">Sort: revenue YoY</option>
      <option value="patyoy">Sort: profit YoY</option>
      <option value="growth">Sort: earnings acceleration</option>
      <option value="runup">Sort: 20-day run-up</option>
      <option value="distance">Sort: distance to entry</option>
      <option value="price">Sort: current price</option>
      <option value="completeness">Sort: data completeness</option>
    </select>
    <button type="button" class="dirbtn" id="dir">↓ High → low</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="sizing" id="sizing">
    <span>Position size for</span>
    <label>capital ₹ <input class="n" id="cap" type="number" min="0" step="10000" value="1000000"></label>
    <label>risk per trade <input class="n sm" id="risk" type="number" min="0.1" max="5" step="0.1" value="1">%</label>
    <label>PEAD cap <input class="n sm" id="pcap" type="number" min="1" max="100" step="1" value="15">% of capital</label>
    <span id="riskhint"></span>
  </div>

  <section id="view" aria-live="polite"></section>

  <p class="foot" id="foot">A mechanical screen, not advice. Levels appear only when a rule-based setup exists; missing data shows as —, never as zero.</p>
</main>
<script src="intelligence.js?v=107"></script>
</body>

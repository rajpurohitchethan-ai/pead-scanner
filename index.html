<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEAD Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --sheet-2:#F5F7FA; --line:#D6DCE5; --line-2:#E6EAF0;
  --ink:#15233F; --ink-2:#4A5874; --ink-3:#7A869C;
  --gain:#0E7A5F; --gain-bg:#E3F3EE; --loss:#B42318; --loss-bg:#FBE9E7;
  --act:#3B3FB6; --act-bg:#E8E9FA; --watch:#A86A12; --watch-bg:#FBF1DF;
  --grid:#E3E8EF; --price:#15233F; --ema:#8A96AD;
  --num:"IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --text:"Instrument Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1622; --sheet:#162133; --sheet-2:#1B283D; --line:#2A3A55; --line-2:#22314A;
    --ink:#E7EDF7; --ink-2:#AAB6CB; --ink-3:#7F8CA4;
    --gain:#3CC79F; --gain-bg:#12352D; --loss:#F07A6C; --loss-bg:#3A1D1D;
    --act:#9EA2FF; --act-bg:#262A5A; --watch:#E6B25C; --watch-bg:#3A2D14;
    --grid:#22314A; --price:#E7EDF7; --ema:#6F7D97; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1622; --sheet:#162133; --sheet-2:#1B283D; --line:#2A3A55; --line-2:#22314A;
  --ink:#E7EDF7; --ink-2:#AAB6CB; --ink-3:#7F8CA4;
  --gain:#3CC79F; --gain-bg:#12352D; --loss:#F07A6C; --loss-bg:#3A1D1D;
  --act:#9EA2FF; --act-bg:#262A5A; --watch:#E6B25C; --watch-bg:#3A2D14;
  --grid:#22314A; --price:#E7EDF7; --ema:#6F7D97; color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--text)}
a{color:var(--act)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 64px}

/* Header */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.mast h1{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.mast h1 small{display:block;font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.regime{max-width:420px;font-size:14px;color:var(--ink-2)}
.regime b{color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--ink-3)}
.dot.on{background:var(--gain)}.dot.mixed{background:var(--watch)}.dot.off{background:var(--loss)}
.season{margin:14px 0 4px;font-size:16px;color:var(--ink-2)}
.season strong{color:var(--ink);font-weight:600}

/* Tabs and controls */
.tabs{display:flex;gap:4px;margin:18px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 14px;border-radius:999px;color:var(--ink-2);font-weight:600;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab .c{font-family:var(--num);font-weight:500;opacity:.75;margin-left:5px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.controls input[type=search]{flex:1 1 200px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.controls select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.toggle{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--act);margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.chip{border:1px solid var(--line);background:var(--sheet);padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--act);color:var(--act);background:var(--act-bg)}

/* Sizing panel */
.sizing{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 12px;margin-bottom:14px;border:1px dashed var(--line);border-radius:10px;font-size:14px;color:var(--ink-2)}
.sizing label{display:inline-flex;align-items:center;gap:6px}
.sizing input{width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.sizing input.sm{width:64px}

/* Setup cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.card{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px 20px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.card.s-go::before{background:var(--act)}
.card.s-watch::before{background:var(--watch)}
.card.s-no::before{background:var(--loss)}
.card.s-pending::before{background:var(--ink-3)}
.card.dim{opacity:.72}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sym{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.co{color:var(--ink-2);font-size:14px;margin-top:1px}
.score{text-align:right;flex:none}
.score .v{font-family:var(--num);font-size:30px;font-weight:600;line-height:1}
.score .l{font-size:12px;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.tag{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--line-2)}
.tag.go{background:var(--act-bg);color:var(--act);border-color:transparent;font-weight:600}
.tag.good{background:var(--gain-bg);color:var(--gain);border-color:transparent}
.tag.bad{background:var(--loss-bg);color:var(--loss);border-color:transparent}
.tag.warn{background:var(--watch-bg);color:var(--watch);border-color:transparent}
.meta{font-size:13px;color:var(--ink-3);margin-top:6px}
.meta.call{margin-top:3px}
.meta.call a{font-weight:600;text-decoration:none;margin-left:4px}
.chart{display:block;width:100%;height:auto;margin:12px 0 4px;border-radius:6px;background:var(--sheet-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-3);margin-bottom:8px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:4px;margin-right:5px;background:var(--ink-3)}
.legend .le{background:var(--act)}.legend .ls{background:var(--loss)}.legend .lm{background:var(--ema);height:0;border-top:2px dashed var(--ema)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;margin:10px 0}
.fact h3{margin:0 0 3px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.fact p{margin:0;font-size:14px;color:var(--ink-2)}
.fact .big{font-family:var(--num);font-size:17px;font-weight:600;color:var(--ink);margin-right:8px}
.up,.fact .big.up{color:var(--gain)} .down,.fact .big.down{color:var(--loss)}
.plan{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:var(--sheet-2)}
.plan-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.plan-sig{font-weight:700}
.plan-sig.go{color:var(--act)} .plan-sig.watch{color:var(--watch)} .plan-sig.no{color:var(--loss)} .plan-sig.pending{color:var(--ink-3)}
.plan-why{font-size:13.5px;color:var(--ink-2);margin:4px 0 0}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.lv span{display:block;font-size:12px;color:var(--ink-3)}
.lv b{font-family:var(--num);font-size:17px;font-weight:600}
.lv.e b{color:var(--act)} .lv.s b{color:var(--loss)}
.qty{font-size:13px;color:var(--ink-2);margin-top:8px}
details.why{margin-top:10px}
details.why summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:600}
.why-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;font-size:13.5px}
.why-cols h4{margin:0 0 4px;font-size:13px}
.why-cols ul{margin:0;padding-left:18px;color:var(--ink-2)}
.why-cols .pos h4{color:var(--gain)} .why-cols .neg h4{color:var(--loss)}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13.5px}
.links a{text-decoration:none;font-weight:600}
.links a:hover{text-decoration:underline}

/* Ledger (watchlist) */
.day{margin:18px 0 6px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:baseline}
.day small{font-weight:500;color:var(--ink-3)}
.ledger{background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) repeat(3,minmax(0,.8fr)) 20px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line-2);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--sheet-2)}
.row .s{font-weight:700}
.row .nm{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{font-size:11.5px;color:var(--ink-3)}
.row .v{font-family:var(--num);font-weight:600}
.row .chev{color:var(--ink-3);transition:transform .15s}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.row-detail{padding:4px 12px 14px;border-top:1px dashed var(--line-2);background:var(--sheet-2)}
.hdr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) repeat(3,minmax(0,.8fr)) 20px;gap:10px;padding:0 12px 6px;font-size:12px;color:var(--ink-3)}

/* Tables */
table{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line-2)}
th{font-size:12.5px;color:var(--ink-3);font-weight:600;border-top:0;background:var(--sheet-2)}
td.r,th.r{text-align:right}
.bar{position:relative;height:8px;background:var(--line-2);border-radius:4px;min-width:90px}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.note{font-size:13.5px;color:var(--ink-2);max-width:70ch}
.fact .note{font-size:12px;margin-top:4px}
.audit{margin:0 0 14px;padding:12px;border:1px solid var(--line,#2a3446);border-radius:12px}.audit h3{margin:0 0 8px;font-size:15px}.arow{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line,#2a3446);font-size:14px}.arow:first-of-type{border-top:0}.arow .tag{flex:none}.muted{opacity:.75;font-size:13px}
.td{margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line,#2a3446);border-radius:12px}
.td-h{font-size:13px;margin-bottom:8px}.td-row{display:flex;flex-wrap:wrap;gap:6px}
.tdc{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line,#2a3446)}
.tdc i{font-style:normal;font-weight:700}.tdc.ok{background:var(--gain-bg);color:var(--gain);border-color:transparent}
.tdc.bad{background:var(--loss-bg);color:var(--loss);border-color:transparent}.tdc.warn{background:var(--watch-bg);color:var(--watch);border-color:transparent}
.tdc.na{opacity:.6}.td-more{margin-top:6px;font-size:13px}.td-more summary{cursor:pointer;opacity:.8}.td-notes{margin:6px 0 0;padding-left:18px}
.peers{margin:8px 0;font-size:13.5px;line-height:1.5}.peers .meta{display:block}
.homework{font-size:12.5px;opacity:.85;margin:10px 0 4px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.tscroll table{min-width:520px}
.srow{cursor:pointer}.chev-s{display:inline-block;width:12px;opacity:.7}.sdetail td{background:var(--card-2,transparent)}
.plist{margin:4px 0 8px;padding-left:22px;font-size:13.5px;line-height:1.7}.plist .n{margin:0 4px}
.controls .dirbtn{white-space:nowrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:inherit;font:inherit}
.install-bad{background:#7f1d1d;color:#fff;border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px;line-height:1.4}
.health{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.hbox{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px}
.hbox span{font-size:12.5px;color:var(--ink-3)}
.hbox b{display:block;font-family:var(--num);font-size:22px;font-weight:600;margin-top:2px}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty button{margin-top:10px;border:1px solid var(--act);background:var(--act-bg);color:var(--act);padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer}
.foot{margin-top:28px;font-size:12.5px;color:var(--ink-3);max-width:80ch}
.theme-btn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px;margin-top:8px;color:var(--ink-2)}

@media (max-width:640px){
  .wrap{padding:14px 12px 56px}
  .mast h1{font-size:24px}
  .levels{grid-template-columns:repeat(2,1fr)}
  .why-cols{grid-template-columns:1fr}
  .row,.hdr{grid-template-columns:minmax(0,1.5fr) repeat(2,minmax(0,.9fr)) 16px}
  .row .opt,.hdr .opt{display:none}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="mast">
    <h1>PEAD radar<small id="sub">Loading results season…</small></h1>
    <div class="regime"><div id="regime"></div><button class="theme-btn" id="theme" type="button">Dark mode</button></div>
  </header>
  <p class="season" id="season"></p>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-tab="setups" aria-selected="true">Declared results<span class="c" id="c-setups"></span></button>
    <button class="tab" role="tab" data-tab="watch" aria-selected="false">Upcoming watchlist<span class="c" id="c-watch"></span></button>
    <button class="tab" role="tab" data-tab="sectors" aria-selected="false">Sectors<span class="c" id="c-sectors"></span></button>
    <button class="tab" role="tab" data-tab="score" aria-selected="false">Scorecard</button>
    <button class="tab" role="tab" data-tab="health" aria-selected="false">Data health</button>
  </nav>

  <div class="controls" id="controls">
    <input type="search" id="q" placeholder="Search symbol, company or sector" aria-label="Search">
    <label class="toggle"><input type="checkbox" id="liquid" checked> Tradeable only</label>
    <select id="sort" aria-label="Sort by">
      <option value="conviction">Sort: conviction</option>
      <option value="topdown">Sort: top-down check</option>
      <option value="date">Sort: result date</option>
      <option value="reaction">Sort: reaction day %</option>
      <option value="rvol">Sort: reaction volume (RVOL)</option>
      <option value="volume">Sort: volume signature (HVE/HVY/HVQ)</option>
      <option value="since">Sort: move since result</option>
      <option value="rs">Sort: strength vs NIFTY 500</option>
      <option value="revyoy">Sort: revenue YoY</option>
      <option value="patyoy">Sort: profit YoY</option>
      <option value="growth">Sort: earnings acceleration</option>
      <option value="runup">Sort: 20-day run-up</option>
      <option value="distance">Sort: distance to entry</option>
      <option value="price">Sort: current price</option>
      <option value="completeness">Sort: data completeness</option>
    </select>
    <button type="button" class="dirbtn" id="dir">↓ High → low</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="sizing" id="sizing">
    <span>Position size for</span>
    <label>capital ₹ <input class="n" id="cap" type="number" min="0" step="10000" value="1000000"></label>
    <label>risk per trade <input class="n sm" id="risk" type="number" min="0.1" max="5" step="0.1" value="1">%</label>
  </div>

  <section id="view" aria-live="polite"></section>

  <p class="foot" id="foot">A mechanical screen, not advice. Levels appear only when a rule-based setup exists; missing data shows as —, never as zero.</p>
</main>
<script src="intelligence.js?v=35"></script>
</body>
</html>

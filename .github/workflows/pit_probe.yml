name: PIT probe
# Temporary: shows the shape of NSE corporates-pit rows (public data) so the insider parser can be fixed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pead_v2.py
            pead_plus.py
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pandas yfinance requests "httpx[http2]" h2 "nse[server]" bse
      - name: Probe
        run: |
          python - <<'PY'
          import re, pead_v2
          ctx = pead_v2.RunContext() if hasattr(pead_v2, 'RunContext') else None
          with pead_v2.NSEAdapter(ctx) as nse:
              cl = nse.client
              tr = getattr(cl, "_transport", None)
              ss = getattr(tr, "_session", None)
              get = (lambda u: ss.get(u, follow_redirects=True)) if ss is not None else (lambda u: tr.request(u))
              for js in ("/dist/js/components/corporate-filing/csps/insider-trading-csp.js?v=20112026", "/dist/js/sections/corporate-filings.js?v=20112026"):
                  t = get("https://www.nseindia.com" + js).text
                  print("JS", js, len(t))
                  for m in re.finditer(r'corporates-pit|api/|Archive|from_date|xbrl', t):
                      print("  ..", t[max(0, m.start()-220): m.start()+260].replace("\n", " "))
          PY

name: PIT probe
# Temporary: shows the shape of NSE corporates-pit rows (public data) so the insider parser can be fixed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pead_v2.py
            pead_plus.py
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pandas yfinance requests "httpx[http2]" h2 "nse[server]" bse
      - name: Probe
        run: |
          python - <<'PY'
          import json, pead_v2, pead_plus
          from datetime import date, timedelta
          ctx = pead_v2.RunContext() if hasattr(pead_v2, 'RunContext') else None
          t = date.today(); f = t - timedelta(days=60)
          with pead_v2.NSEAdapter(ctx) as nse:
              for s in ("RELIANCE", "RAMCOIND", "GROWW", "AONESTEELS", "SEJALLTD"):
                  for extra in ({}, {"from_date": f.strftime("%d-%m-%Y"), "to_date": t.strftime("%d-%m-%Y")}):
                      try:
                          p = nse._api_get("corporates-pit", {"index": "equities", "symbol": s, **extra})
                      except Exception as e:
                          print(s, extra and "dated", "ERR", type(e).__name__, e); continue
                      rows = pead_v2._deal_rows(p)
                      ds = sorted(pead_plus._pit_date(r.get("acqtoDt"), r.get("intimDt"), r.get("date")) or "" for r in rows)
                      print("==", s, "dated" if extra else "plain", "rows", len(rows), "dates", ds[:1], ds[-1:],
                            "parsed", len(pead_plus.parse_insider_rows(rows)))
          PY

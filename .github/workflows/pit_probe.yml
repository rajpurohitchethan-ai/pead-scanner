name: PIT probe
# Temporary: shows the shape of NSE corporates-pit rows (public data) so the insider parser can be fixed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pead_v2.py
            pead_plus.py
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pandas yfinance requests "httpx[http2]" h2 "nse[server]" bse
      - name: Probe
        run: |
          python - <<'PY'
          import json, collections, pead_v2
          from datetime import date, timedelta
          ctx = pead_v2.RunContext() if hasattr(pead_v2, 'RunContext') else None
          t = date.today(); f = t - timedelta(days=60)
          dd = {"from_date": f.strftime("%d-%m-%Y"), "to_date": t.strftime("%d-%m-%Y")}
          with pead_v2.NSEAdapter(ctx) as nse:
              for q in ({"index": "equities", "symbol": "RAMCOIND", **dd}, {"index": "equities", "symbol": "RELIANCE", **dd},
                        {"index": "equities", "symbol": "GROWW"}, {"index": "equities", **dd}):
                  try:
                      p = nse._api_get("corporates-pit-gg", q)
                  except Exception as e:
                      print("== ERR", q, type(e).__name__, e); continue
                  rows = pead_v2._deal_rows(p)
                  print("==", q.get("symbol", "ALL"), sorted(q), type(p).__name__, list(p.keys())[:12] if isinstance(p, dict) else None, "rows", len(rows))
                  for r in rows[:2]:
                      print("ROW", json.dumps(r)[:1800])
                  if rows:
                      for k in list(rows[0].keys()):
                          c = collections.Counter(str(r.get(k))[:40] for r in rows)
                          if 1 < len(c) <= 12: print("  ", k, c.most_common(8))
          PY

name: PIT probe
# Temporary: shows the shape of NSE corporates-pit rows (public data) so the insider parser can be fixed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pead_v2.py
            pead_plus.py
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pandas yfinance requests "httpx[http2]" h2 "nse[server]" bse
      - name: Probe
        run: |
          python - <<'PY'
          import re, pead_v2
          from datetime import date, timedelta
          ctx = pead_v2.RunContext() if hasattr(pead_v2, 'RunContext') else None
          t = date.today(); f = t - timedelta(days=3)
          with pead_v2.NSEAdapter(ctx) as nse:
              rows = pead_v2._deal_rows(nse._api_get("corporates-pit-gg", {"index": "equities", "from_date": f.strftime("%d-%m-%Y"), "to_date": t.strftime("%d-%m-%Y")}))
          print("rows", len(rows))
          for r in rows[:3]:
              x = pead_v2._eod_get(r["xmlFileName"])
              print("== XML", r["symbol"], len(x))
              for m in re.finditer(r"<([A-Za-z0-9_\-]+:[A-Za-z0-9_]+)([^>]*)>([^<]{0,120})</", x):
                  print("  ", m.group(1), "|", re.sub(r"\s+", " ", m.group(2))[:70], "|", m.group(3).strip())
          PY

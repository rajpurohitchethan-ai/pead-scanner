name: PIT probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pead_v2.py
            pead_plus.py
            master/nse_holidays.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pandas requests "httpx[http2]" h2 "nse[server]"
      - name: Try request forms
        run: |
          python - <<'PY'
          import pead_v2 as p, json
          from datetime import date, timedelta
          ctx = p.SourceContext(raw=p.RawCache(), log=p.FetchLogger())
          t = date.today()
          f = lambda d: d.strftime("%d-%m-%Y")
          tries = {
            "sym_nodates": ("corporates-pit", {"index": "equities", "symbol": "TIPSMUSIC"}),
            "sym_dates": ("corporates-pit", {"index": "equities", "symbol": "TIPSMUSIC", "from_date": f(t - timedelta(days=90)), "to_date": f(t)}),
            "dates_ddmmyyyy_slash": ("corporates-pit", {"index": "equities", "from_date": (t - timedelta(days=7)).strftime("%d/%m/%Y"), "to_date": t.strftime("%d/%m/%Y")}),
          }
          with p.NSEAdapter(ctx) as nse:
              for name, (path, params) in tries.items():
                  try:
                      d = nse._api_get(path, params)
                      rows = d.get("data") if isinstance(d, dict) else d
                      print(name, "ROWS", len(rows or []))
                      if rows:
                          print(name, "KEYS", sorted(rows[0].keys()))
                          ds = sorted({str(r.get("date"))[:11] for r in rows})
                          print(name, "DATES", ds[:3], ds[-3:])
                          for r in rows[:3]: print(name, "ROW", {k: r.get(k) for k in ("symbol","personCategory","acqMode","tdpTransactionType","secAcq","secVal","buyValue","sellValue","acqtoDt","date")})
                  except Exception as e:
                      print(name, "ERR", type(e).__name__, str(e)[:200])
          PY

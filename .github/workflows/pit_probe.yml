name: PIT probe
# Temporary: shows the shape of NSE corporates-pit rows (public data) so the insider parser can be fixed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            pead_v2.py
            pead_plus.py
            requirements.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pandas yfinance requests "httpx[http2]" h2 "nse[server]" bse
      - name: Probe
        run: |
          python - <<'PY'
          import re, pead_v2
          ctx = pead_v2.RunContext() if hasattr(pead_v2, 'RunContext') else None
          with pead_v2.NSEAdapter(ctx) as nse:
              cl = nse.client
              tr = getattr(cl, "_transport", None)
              ss = getattr(tr, "_session", None)
              get = (lambda u: ss.get(u, follow_redirects=True)) if ss is not None else (lambda u: tr.request(u))
              seen = set()
              for page in ("https://www.nseindia.com/companies-listing/corporate-filings-insider-trading",):
                  try:
                      h = get(page).text
                  except Exception as e:
                      print("page ERR", e); continue
                  print("page", len(h))
                  srcs = re.findall(r'src="([^"]+\.js[^"]*)"', h)
                  print("scripts", srcs[:40])
                  for m in re.findall(r'(?:api/|/api/)[A-Za-z0-9_\-/]+', h): seen.add(m)
                  for js in srcs:
                      u = js if js.startswith("http") else "https://www.nseindia.com" + js
                      try:
                          t = get(u).text
                      except Exception as e:
                          print("js ERR", u, e); continue
                      for m in re.findall(r'["\'](?:/api/)?([A-Za-z0-9_\-]*(?:pit|insider|Pit|Insider|PIT|xbrl)[A-Za-z0-9_\-/]*)["\'?]', t):
                          seen.add(m)
              print("found", sorted(seen)[:120])
          PY

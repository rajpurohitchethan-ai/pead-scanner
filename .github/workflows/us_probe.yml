name: US source probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          UA="pead-scanner (rajpurohitchethan-ai@users.noreply.github.com)"
          BR="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          p() { echo "=== $1"; code=$(curl -sS -m 25 -o out.txt -w '%{http_code}' -H "User-Agent: $2" -H "Accept: application/json, text/html, */*" -H "Accept-Language: en-US,en;q=0.9" "$3" || echo ERR); echo "HTTP $code size $(wc -c < out.txt)"; head -c "${4:-500}" out.txt; echo; }
          p sec_tickers "$UA" "https://www.sec.gov/files/company_tickers.json" 300
          p sec_submissions "$UA" "https://data.sec.gov/submissions/CIK0000320193.json" 400
          p sec_frames "$UA" "https://data.sec.gov/api/xbrl/frames/us-gaap/NetIncomeLoss/USD/CY2026Q3.json" 500
          p sec_frames_rev "$UA" "https://data.sec.gov/api/xbrl/frames/us-gaap/RevenueFromContractWithCustomerExcludingAssessedTax/USD/CY2026Q3.json" 300
          p nasdaq_cal "$BR" "https://api.nasdaq.com/api/calendar/earnings?date=2026-11-05" 1500
          p yahoo_chart "$BR" "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d" 900
          p yahoo_q2 "$BR" "https://query2.finance.yahoo.com/v8/finance/chart/MSFT?range=1y&interval=1d&events=div%2Csplits" 200
          p stooq "$BR" "https://stooq.com/q/d/l/?s=aapl.us&i=d" 300
          p wiki500 "$UA" "https://en.wikipedia.org/w/index.php?title=List_of_S%26P_500_companies&action=raw" 600
          p wiki400 "$UA" "https://en.wikipedia.org/w/index.php?title=List_of_S%26P_400_companies&action=raw" 900
          p wiki600 "$UA" "https://en.wikipedia.org/w/index.php?title=List_of_S%26P_600_companies&action=raw" 900
          p sec_frames_eps "$UA" "https://data.sec.gov/api/xbrl/frames/us-gaap/EarningsPerShareDiluted/USD-per-shares/CY2026Q3.json" 300

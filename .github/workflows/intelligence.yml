name: PEAD intelligence lab

"on":
  workflow_dispatch:

  workflow_run:
    workflows:
      - PEAD hourly scanner
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: pead-intelligence-lab
  cancel-in-progress: false

jobs:
  intelligence:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install intelligence dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yfinance pandas

      - name: Check intelligence syntax
        run: |
          python -m py_compile pead_intelligence.py

      - name: Verify live base
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data.json")

          if not path.exists():
              print("ERROR: data.json missing")
              sys.exit(1)

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          rows = (
              data.get("stocks")
              or data.get("companies")
              or []
          )

          if not rows:
              print("ERROR: base contains 0 stocks")
              sys.exit(1)

          print("LIVE BASE COUNT:", len(rows))

          print(
              "BASE GENERATED AT:",
              data.get("generatedAt")
              or data.get("last_scan")
              or data.get("lastScanAt")
          )
          PY

      - name: Build fresh intelligence candidate
        run: |
          rm -f /tmp/intelligence.new.json

          python pead_intelligence.py \
            --data data.json \
            --output /tmp/intelligence.new.json

          if [ ! -s /tmp/intelligence.new.json ]; then
            echo "ERROR: fresh intelligence candidate was not created"
            exit 1
          fi

          echo "Fresh candidate created:"
          ls -lh /tmp/intelligence.new.json

      - name: Verify candidate matches base
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          base = json.loads(
              Path("data.json").read_text(
                  encoding="utf-8"
              )
          )

          candidate = json.loads(
              Path("/tmp/intelligence.new.json").read_text(
                  encoding="utf-8"
              )
          )

          base_rows = (
              base.get("stocks")
              or base.get("companies")
              or []
          )

          items = (
              candidate.get("items")
              or []
          )

          base_count = len(base_rows)
          item_count = len(items)

          source_count = candidate.get(
              "sourceStockCount"
          )

          base_stamp = (
              base.get("generatedAt")
              or base.get("last_scan")
              or base.get("lastScanAt")
          )

          source_stamp = candidate.get(
              "sourceDataGeneratedAt"
          )

          print(
              "BASE COUNT:",
              base_count
          )

          print(
              "INTELLIGENCE COUNT:",
              item_count
          )

          print(
              "SOURCE COUNT:",
              source_count
          )

          print(
              "BASE TIMESTAMP:",
              base_stamp
          )

          print(
              "SOURCE TIMESTAMP:",
              source_stamp
          )

          if base_count == 0:
              print(
                  "ERROR: base has 0 stocks"
              )
              sys.exit(1)

          if item_count != base_count:
              print(
                  "ERROR: intelligence count does not match base"
              )
              sys.exit(1)

          if source_count != base_count:
              print(
                  "ERROR: sourceStockCount does not match base"
              )
              sys.exit(1)

          if (
              base_stamp
              and source_stamp
              and str(base_stamp)
              != str(source_stamp)
          ):
              print(
                  "ERROR: candidate was built from a different base timestamp"
              )
              sys.exit(1)

          print(
              "CANDIDATE SYNC CHECK PASSED"
          )
          PY

      - name: Confirm main did not change during analysis
        run: |
          git fetch origin main

          git show origin/main:data.json > /tmp/latest-data.json

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          latest = json.loads(
              Path("/tmp/latest-data.json").read_text(
                  encoding="utf-8"
              )
          )

          candidate = json.loads(
              Path("/tmp/intelligence.new.json").read_text(
                  encoding="utf-8"
              )
          )

          latest_rows = (
              latest.get("stocks")
              or latest.get("companies")
              or []
          )

          latest_count = len(
              latest_rows
          )

          candidate_count = len(
              candidate.get("items")
              or []
          )

          latest_stamp = (
              latest.get("generatedAt")
              or latest.get("last_scan")
              or latest.get("lastScanAt")
          )

          candidate_stamp = candidate.get(
              "sourceDataGeneratedAt"
          )

          print(
              "LATEST BASE COUNT:",
              latest_count
          )

          print(
              "CANDIDATE COUNT:",
              candidate_count
          )

          print(
              "LATEST BASE TIMESTAMP:",
              latest_stamp
          )

          print(
              "CANDIDATE SOURCE TIMESTAMP:",
              candidate_stamp
          )

          if latest_count != candidate_count:
              print(
                  "ERROR: main changed while intelligence was running"
              )
              sys.exit(1)

          if (
              latest_stamp
              and candidate_stamp
              and str(latest_stamp)
              != str(candidate_stamp)
          ):
              print(
                  "ERROR: base timestamp changed while intelligence was running"
              )
              sys.exit(1)

          print(
              "FINAL SYNC CHECK PASSED"
          )
          PY

      - name: Show intelligence summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("/tmp/intelligence.new.json").read_text(
                  encoding="utf-8"
              )
          )

          print(
              "SOURCE STOCKS:",
              data.get("sourceStockCount")
          )

          print(
              "GENERATED AT:",
              data.get("generatedAt")
          )

          print(
              "COUNTS:",
              json.dumps(
                  data.get("counts", {}),
                  indent=2
              )
          )
          PY

      - name: Publish intelligence.json
        run: |
          git reset --hard origin/main

          cp /tmp/intelligence.new.json intelligence.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add intelligence.json

          if git diff --cached --quiet; then
            echo "No intelligence changes to publish"
            exit 0
          fi

          git commit -m "chore: refresh PEAD intelligence"

          git push origin HEAD:main

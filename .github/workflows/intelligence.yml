name: PEAD intelligence lab

on:
  workflow_dispatch:

  schedule:
    - cron: "30 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: pead-intelligence-lab
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install intelligence dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yfinance pandas

      - name: Check intelligence syntax
        run: |
          python -m py_compile pead_intelligence.py

      - name: Verify base is present
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data.json")

          if not path.exists():
              print("ERROR: data.json missing")
              sys.exit(1)

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          rows = (
              data.get("stocks")
              or data.get("companies")
              or []
          )

          if not rows:
              print("ERROR: base has 0 stocks")
              sys.exit(1)

          print("Base stock count:", len(rows))
          PY

      - name: Build intelligence candidate file
        run: |
          rm -f /tmp/intelligence.new.json

          python pead_intelligence.py \
            --data data.json \
            --output /tmp/intelligence.new.json

          if [ -s /tmp/intelligence.new.json ]; then
            echo "Candidate created successfully"
          elif [ -s intelligence.json ]; then
            echo "Using generated intelligence.json as candidate"
            cp intelligence.json /tmp/intelligence.new.json
          else
            echo "ERROR: intelligence engine produced no JSON"
            exit 1
          fi

          ls -lh /tmp/intelligence.new.json

      - name: Zero and drop protection
        run: |
          python - <<'PY'
          import json
          import math
          import sys
          from pathlib import Path

          base = json.loads(
              Path("data.json").read_text(
                  encoding="utf-8"
              )
          )

          candidate = json.loads(
              Path("/tmp/intelligence.new.json").read_text(
                  encoding="utf-8"
              )
          )

          base_rows = (
              base.get("stocks")
              or base.get("companies")
              or []
          )

          items = candidate.get("items") or []

          base_count = len(base_rows)
          intelligence_count = len(items)

          minimum = max(
              1,
              math.floor(
                  base_count * 0.80
              )
          )

          print("Base rows:", base_count)
          print("Intelligence rows:", intelligence_count)
          print("Minimum allowed:", minimum)

          if intelligence_count == 0:
              print("ERROR: Intelligence produced 0 rows")
              sys.exit(1)

          if intelligence_count < minimum:
              print(
                  "ERROR: Intelligence universe dropped too far. "
                  "Existing intelligence.json will remain untouched."
              )
              sys.exit(1)

          print("Safety check passed")
          PY

      - name: Publish intelligence file locally
        run: |
          cp /tmp/intelligence.new.json intelligence.json

      - name: Show intelligence summary
        run: |
          python - <<'PY'
          import json

          with open(
              "intelligence.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Source stocks:",
              data.get("sourceStockCount")
          )

          print(
              "Generated:",
              data.get("generatedAt")
          )

          print(
              "Counts:",
              data.get("counts")
          )
          PY

      - name: Commit intelligence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp intelligence.json /tmp/intelligence.publish.json

          for attempt in 1 2 3
          do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/intelligence.publish.json intelligence.json

            git add intelligence.json

            if git diff --cached --quiet
            then
              echo "No intelligence changes to commit"
              exit 0
            fi

            git commit -m "chore: refresh PEAD intelligence"

            if git push origin HEAD:main
            then
              echo "PEAD intelligence pushed successfully"
              exit 0
            fi

            echo "Push conflict. Retrying..."
            sleep 3
          done

          echo "ERROR: could not publish intelligence after 3 attempts"
          exit 1

name: PEAD intelligence lab (v2 integrated)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pead-v2-event-engine
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run PEAD v2 engine
        run: |
          python -m py_compile pead_v2.py
          python pead_v2.py --self-test
          python -m unittest discover -s tests -v
          node tests/test_dashboard.js
          python pead_v2.py

      - name: Commit refresh
        if: always()
        run: |
          git config user.name "PEAD v2 bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json intelligence.json run_health.json || true
          [ -d events ] && git add events || true
          [ -d raw ] && git add raw || true
          [ -d logs ] && git add logs || true
          [ -d master ] && git add master || true
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "PEAD v2: manual intelligence refresh"
          git push

name: PEAD hourly scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Run shortly after the hour, every hour.
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: pead-hourly-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Build live radar data
        env:
          MIN_MCAP_CR: '1000'
        run: python scan.py

      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data.json')
          if not p.exists():
              raise SystemExit('data.json was not generated')
          d = json.loads(p.read_text())
          rows = d.get('stocks') or d.get('companies') or []
          print('generated rows:', len(rows), 'sourceCount:', d.get('sourceCount'), 'errors:', d.get('errorCount'))
          if d.get('sourceCount', 0) and not rows:
              raise SystemExit('Refusing to publish an empty feed from a non-empty companies.json')
          PY

      - name: Commit refreshed data.json
        run: |
          if git diff --quiet -- data.json; then
            echo 'No data.json changes to commit.'
            exit 0
          fi
          git config user.name 'pead-scanner-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m 'chore: refresh PEAD live scan'
          git push
          

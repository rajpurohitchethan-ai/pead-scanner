name: PEAD scan
on:
  schedule:
    - cron: "5 4-10 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scan.py
      - name: Commit data
        run: |
          git config user.name "pead-bot"; git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "scan $(date -u +%FT%TZ)" && git push)
      - name: Publish site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
  

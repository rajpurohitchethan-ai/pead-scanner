name: PEAD hourly scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: pead-hourly-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade nse bse yfinance pandas "mcp>=2,<3"

      - name: Check Python syntax
        run: |
          python -m py_compile scan.py
          python -m py_compile nse_mcp.py
          python -m py_compile qualify.py

      - name: Probe official NSE MCP tools
        continue-on-error: true
        run: |
          python nse_mcp.py --probe

      - name: Run live discovery scanner
        run: |
          python scan.py

      - name: Run PEAD qualification engine
        run: |
          python qualify.py

      - name: Validate qualified data.json
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data.json")

          if not path.exists():
              print("ERROR: data.json missing")
              sys.exit(1)

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          if data.get("scannerMode") != "live-discovery":
              print("ERROR: scanner is not live-discovery")
              sys.exit(1)

          if data.get("qualificationVersion") != "pead-v1.1-nse-mcp":
              print("ERROR: NSE MCP qualifier did not run")
              sys.exit(1)

          rows = (
              data.get("stocks")
              or data.get("companies")
              or []
          )

          if not rows:
              print("ERROR: 0 stocks published")
              sys.exit(1)

          print("Scanner:", data.get("scannerMode"))
          print("Qualifier:", data.get("qualificationVersion"))
          print("Market data mode:", data.get("marketDataMode"))
          print("Discovered:", data.get("discoveredCandidateCount"))
          print("Published:", len(rows))
          print("Buckets:", data.get("bucketCounts"))
          print("NSE MCP:", data.get("nseMcp"))
          print("NSE MCP warnings:", len(data.get("nseMcpErrors") or []))
          print("Result source stats:", data.get("resultSourceStats"))
          print("Result source warnings:", len(data.get("resultSourceErrors") or []))

          released = [r for r in rows if r.get("resultsReleased") is True]
          print("Results released rows:", len(released))
          for r in released[:25]:
              print(
                  "RESULT:",
                  r.get("symbol"),
                  "|", r.get("quarter"),
                  "| source:", r.get("resultSource") or r.get("discoverySource"),
                  "| Rev YoY:", r.get("revenueYoY"),
                  "| PAT YoY:", r.get("patYoY"),
              )
          PY

      - name: Show PEAD candidate summary
        run: |
          python - <<'PY'
          import json

          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          rows = data.get("stocks") or []

          order = {
              "Qualified": 0,
              "Caution": 1,
              "Post-results": 2,
              "Upcoming": 3,
          }

          rows = sorted(
              rows,
              key=lambda x: (
                  order.get(
                      x.get("bucket"),
                      9
                  ),
                  -(x.get("score") or 0),
              ),
          )

          print("========== PEAD SUMMARY ==========")
          print("Buckets:", data.get("bucketCounts"))
          print("MCP:", data.get("nseMcp"))
          print("==================================")

          for stock in rows[:50]:
              print(
                  stock.get("symbol"),
                  "|",
                  stock.get("bucket"),
                  "|",
                  stock.get("scoreText"),
                  "| price source:",
                  stock.get("priceSource"),
                  "| history:",
                  stock.get("historySource"),
                  "| entry:",
                  stock.get("entry"),
                  "| SL:",
                  stock.get("sl"),
              )
          PY

      - name: Commit refreshed qualified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No data.json changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh live PEAD qualification"

          git pull --rebase origin main

          git push origin main

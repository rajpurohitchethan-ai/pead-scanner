name: PEAD hourly scanner

on:
  workflow_dispatch:

  schedule:
    # Runs every hour, Monday-Friday.
    # GitHub cron uses UTC.
    - cron: "0 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: pead-hourly-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live scanner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "nse[server]"

      - name: Check scanner syntax
        run: |
          python -m py_compile scan.py

      - name: Run live PEAD scanner
        run: |
          python scan.py

      - name: Validate data.json
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data.json")

          if not path.exists():
              print("ERROR: data.json was not created")
              sys.exit(1)

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print("ERROR: invalid data.json:", exc)
              sys.exit(1)

          stocks = data.get("stocks")

          if not isinstance(stocks, list):
              stocks = data.get("companies")

          if not isinstance(stocks, list):
              print("ERROR: data.json contains neither a stocks[] nor companies[] list")
              sys.exit(1)

          if len(stocks) == 0:
              print("ERROR: scanner produced 0 stocks")
              print("Refusing to publish empty radar data")
              sys.exit(1)

          mode = data.get("scannerMode")
          source = data.get("source")
          errors = data.get("errorCount", 0)
          discovered = data.get("discoveredCandidateCount", "unknown")

          print("================================")
          print("PEAD DATA VALIDATION")
          print("================================")
          print("Scanner mode:", mode)
          print("Source:", source)
          print("Discovered candidates:", discovered)
          print("Published stocks:", len(stocks))
          print("Scanner errors:", errors)

          if mode != "live-discovery":
              print(
                  "WARNING: scannerMode is not live-discovery. "
                  "Check whether the latest scan.py is committed."
              )

          print("data.json validation passed")
          PY

      - name: Show scanner summary
        run: |
          python - <<'PY'
          import json

          with open("data.json", "r", encoding="utf-8") as f:
              d = json.load(f)

          rows = d.get("stocks") or d.get("companies") or []

          print("")
          print("========== PEAD LIVE SCAN ==========")
          print("Generated:", d.get("generatedAt"))
          print("Mode:", d.get("scannerMode"))
          print("Source:", d.get("source"))
          print("Discovered:", d.get("discoveredCandidateCount"))
          print("Published:", len(rows))
          print("Below ₹1,000 Cr:", d.get("marketCapRejectedCount"))
          print("Market cap unavailable:", d.get("marketCapUnavailableCount"))
          print("Errors:", d.get("errorCount"))
          print("====================================")
          print("")

          for stock in rows[:20]:
              print(
                  stock.get("symbol"),
                  "|",
                  stock.get("bucket"),
                  "| ₹",
                  stock.get("price"),
                  "| Mcap:",
                  stock.get("marketCapCr"),
                  "Cr",
              )
          PY

      - name: Commit refreshed live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No data.json changes to commit"
          else
            git commit -m "chore: refresh live PEAD scan"
            git push
          fi

name: PEAD sca[span_3](start_span)[span_3](end_span)n

on:
  schedule:
    # Hourly market-hours execution (IST 09:35 to 15:35, UTC 04:05 to 10:05)
    - cron: '5 4-10 * * 1-5'
    # Evening sweep for corporate board disclosures (IST 19:00, UTC 13:30)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: scan

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Initialize Python 3.12 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Ingestion Dependencies
        run: pip install -r requirements.txt

      - name: Execute Autonomous Multi-Gate Engine
        run: python scan.py

      - name: Commit and Push Verified State
        run: |
          git config user.name "pead-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "scan $(date -u +%Y%m%d%H%M%SZ) [skip ci]" && git push)

      - name: Trigger GitHub Pages Deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
        

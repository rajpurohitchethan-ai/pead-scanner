name: PEAD hourly scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: pead-hourly-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade nse yfinance pandas

      - name: Check Python syntax
        run: |
          python -m py_compile scan.py
          python -m py_compile qualify.py

      - name: Run live discovery scanner
        run: |
          python scan.py

      - name: Run PEAD qualification engine
        run: |
          python qualify.py

      - name: Validate qualified data.json
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data.json")

          if not path.exists():
              print("ERROR: data.json missing")
              sys.exit(1)

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          if data.get("scannerMode") != "live-discovery":
              print("ERROR: scanner is not live-discovery")
              sys.exit(1)

          if data.get("qualificationVersion") != "pead-v1.0":
              print("ERROR: qualifier did not run")
              sys.exit(1)

          rows = (
              data.get("stocks")
              or
              data.get("companies")
              or
              []
          )

          if not rows:
              print("ERROR: 0 stocks published")
              sys.exit(1)

          print("Scanner:", data.get("scannerMode"))
          print("Qualifier:", data.get("qualificationVersion"))
          print("Discovered:", data.get("discoveredCandidateCount"))
          print("Published:", len(rows))
          print("Buckets:", data.get("bucketCounts"))
          print("Errors:", data.get("errorCount"))
          PY

      - name: Show PEAD candidate summary
        run: |
          python - <<'PY'
          import json

          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          rows = data.get("stocks") or []

          order = {
              "Qualified": 0,
              "Caution": 1,
              "Post-results": 2,
              "Upcoming": 3,
          }

          rows = sorted(
              rows,
              key=lambda x: (
                  order.get(
                      x.get("bucket"),
                      9
                  ),
                  -(x.get("score") or 0),
              ),
          )

          print("========== PEAD SUMMARY ==========")
          print("Buckets:", data.get("bucketCounts"))
          print("==================================")

          for stock in rows[:40]:

              print(
                  stock.get("symbol"),
                  "|",
                  stock.get("bucket"),
                  "|",
                  stock.get("scoreText"),
                  "| priced-in:",
                  stock.get("pricedIn"),
                  "| sector:",
                  stock.get("sectorTailwind"),
                  "| entry:",
                  stock.get("entry"),
                  "| SL:",
                  stock.get("sl"),
                  "| allocation:",
                  stock.get("allocationPct"),
              )
          PY

      - name: Commit refreshed qualified data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No data.json changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh live PEAD qualification"

          git pull --rebase origin main

          git push origin main

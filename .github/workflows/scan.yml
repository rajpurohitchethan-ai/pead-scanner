name: PEAD v2 event engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal refresh | integrity_report = dry run, shows revocations + signature | validate_financials = live XBRL/NSE/BSE cross-check (no publish)"
        required: false
        default: "run"
        type: choice
        options:
          - "run"
          - "integrity_report"
          - "validate_financials"
      approve_baseline:
        description: "Integrity signature to approve (from integrity_report). Leave blank normally."
        required: false
        default: ""
        type: string
      force_publish:
        description: "Override quality gate (manual recovery only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # 08:45–23:45 IST, Monday–Saturday. Results are often filed after market close.
    - cron: "15 3-18 * * 1-6"

permissions:
  contents: write

concurrency:
  group: pead-v2-event-engine
  cancel-in-progress: false

jobs:
  pead-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PEAD v2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pandas yfinance requests "httpx[http2]" h2 "nse[server]" bse

      - name: Validate engine
        run: |
          python -m py_compile pead_v2.py
          python pead_v2.py --self-test
          python -m unittest discover -s tests -v

      - name: Integrity report (dry run, no publish)
        if: github.event.inputs.mode == 'integrity_report'
        run: python pead_v2.py --integrity-report

      - name: Validate live financials (no publish)
        if: github.event.inputs.mode == 'validate_financials'
        run: python pead_v2.py --validate-financials --limit 40

      - name: Run persistent event engine
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'run' || github.event.inputs.mode == ''
        env:
          MIN_MCAP_CR: "1000"
          DISCOVERY_LOOKBACK_DAYS: "75"
          UPCOMING_DAYS: "45"
          SOURCE_RETRY_ATTEMPTS: "3"
          SOURCE_DELAY_SEC: "1.25"
        run: |
          APPROVE="${{ github.event.inputs.approve_baseline || '' }}"
          if [ "${{ github.event.inputs.force_publish || 'false' }}" = "true" ]; then
            python pead_v2.py --force-publish
          elif [ -n "$APPROVE" ]; then
            python pead_v2.py --approve-baseline "$APPROVE"
          else
            python pead_v2.py
          fi

      - name: Show data health
        if: always()
        run: |
          if [ -f run_health.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("run_health.json").read_text(encoding="utf-8"))
          print("Events tracked:", d.get("eventsTracked"))
          print("Results filed:", d.get("resultsFiled"))
          print("Financials parsed:", d.get("financialsParsed"))
          print("Financials verified / flagged:", d.get("financialsVerified"), "/", d.get("financialsFlagged"))
          print("Integrity:", d.get("integrity"))
          print("Reaction ready:", d.get("reactionReady"))
          print("Fully scored:", d.get("fullyScored"))
          print("Declared completeness:", d.get("declaredCompletenessPct"))
          print("Fetch OK / failed:", d.get("fetchesOk"), "/", d.get("fetchesFailed"))
          print("Quality gate:", d.get("qualityGate"))
          PY
          fi

      - name: Commit persistent state and published feeds
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'run' || github.event.inputs.mode == ''
        run: |
          git config user.name "PEAD v2 bot"
          git config user.email "actions@users.noreply.github.com"

          # The engine creates these folders on first run. Add only if present.
          git add pead_v2.py data.json intelligence.json run_health.json || true
          [ -d events ] && git add events || true
          [ -d raw ] && git add raw || true
          [ -d logs ] && git add logs || true
          [ -d master ] && git add master || true
          git add intelligence.html intelligence.js || true

          if git diff --cached --quiet; then
            echo "No PEAD v2 changes to commit."
            exit 0
          fi

          git commit -m "PEAD v2: persistent event update"
          git push

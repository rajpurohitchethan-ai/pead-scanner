name: PEAD hourly scanner

on:
  workflow_dispatch:

  schedule:
    # Every hour Monday-Friday
    # GitHub Actions cron uses UTC
    - cron: "0 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: pead-hourly-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install live scanner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade nse

      - name: Show NSE package version
        run: |
          python - <<'PY'
          import importlib.metadata

          try:
              print("nse version:", importlib.metadata.version("nse"))
          except Exception as exc:
              print("Unable to read nse version:", exc)
          PY

      - name: Check scanner syntax
        run: |
          python -m py_compile scan.py

      - name: Run live PEAD scanner
        run: |
          python scan.py

      - name: Validate live data.json
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data.json")

          if not path.exists():
              print("ERROR: data.json does not exist")
              sys.exit(1)

          try:
              data = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )
          except Exception as exc:
              print(
                  "ERROR: invalid JSON:",
                  exc
              )
              sys.exit(1)

          mode = data.get(
              "scannerMode"
          )

          if mode != "live-discovery":
              print(
                  "ERROR: scannerMode is",
                  mode
              )
              print(
                  "Expected live-discovery"
              )
              sys.exit(1)

          stocks = (
              data.get("stocks")
              or
              data.get("companies")
              or
              []
          )

          if not isinstance(
              stocks,
              list
          ):
              print(
                  "ERROR: stocks is not a list"
              )
              sys.exit(1)

          if len(stocks) == 0:
              print(
                  "ERROR: live scanner "
                  "published 0 stocks"
              )
              sys.exit(1)

          print(
              "================================="
          )
          print(
              "LIVE DATA VALIDATION PASSED"
          )
          print(
              "================================="
          )

          print(
              "Scanner mode:",
              mode
          )

          print(
              "Source:",
              data.get("source")
          )

          print(
              "Board meetings:",
              data.get(
                  "boardMeetingRows"
              )
          )

          print(
              "Financial results:",
              data.get(
                  "financialResultRows"
              )
          )

          print(
              "Discovered candidates:",
              data.get(
                  "discoveredCandidateCount"
              )
          )

          print(
              "Published stocks:",
              len(stocks)
          )

          print(
              "Errors:",
              data.get(
                  "errorCount"
              )
          )
          PY

      - name: Show live scanner summary
        run: |
          python - <<'PY'
          import json

          with open(
              "data.json",
              "r",
              encoding="utf-8"
          ) as f:
              d = json.load(f)

          rows = (
              d.get("stocks")
              or
              d.get("companies")
              or
              []
          )

          print("")
          print(
              "========== LIVE PEAD SCAN =========="
          )

          print(
              "Generated:",
              d.get("generatedAt")
          )

          print(
              "Mode:",
              d.get("scannerMode")
          )

          print(
              "Source:",
              d.get("source")
          )

          print(
              "Discovered:",
              d.get(
                  "discoveredCandidateCount"
              )
          )

          print(
              "Published:",
              len(rows)
          )

          print(
              "Below ₹1,000 Cr:",
              d.get(
                  "marketCapRejectedCount"
              )
          )

          print(
              "Errors:",
              d.get("errorCount")
          )

          print(
              "===================================="
          )

          for stock in rows[:30]:
              print(
                  stock.get("symbol"),
                  "|",
                  stock.get("bucket"),
                  "| Price:",
                  stock.get("price"),
                  "| Mcap:",
                  stock.get("marketCapCr"),
                  "| Result:",
                  stock.get("resultDate"),
              )
          PY

      - name: Commit refreshed live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No data.json changes to commit"
            exit 0
          fi

          git commit -m "chore: refresh live PEAD scan"

          git pull --rebase origin main

          git push origin main
